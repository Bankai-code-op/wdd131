<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review for our innovative technology products.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <title>Product Review Form</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
        <p class="subtitle">Share your experience with our products</p>
    </header>

    <main>
        <form action="review.html" method="get">

            <!-- Product Name -->
            <fieldset>
                <legend>Product Information</legend>

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                        <!-- Options populated by JavaScript -->
                    </select>
                </div>
            </fieldset>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <div class="form-group rating-group">
                    <div class="star-rating" role="radiogroup" aria-label="Product rating from 1 to 5 stars">
                        <input type="radio" id="rate5" name="rating" value="5" required>
                        <label for="rate5" title="5 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only">5 stars</span></label>

                        <input type="radio" id="rate4" name="rating" value="4" required>
                        <label for="rate4" title="4 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only">4 stars</span></label>

                        <input type="radio" id="rate3" name="rating" value="3" required>
                        <label for="rate3" title="3 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only">3 stars</span></label>

                        <input type="radio" id="rate2" name="rating" value="2" required>
                        <label for="rate2" title="2 stars"><span aria-hidden="true">&#9733;</span><span class="sr-only">2 stars</span></label>

                        <input type="radio" id="rate1" name="rating" value="1" required>
                        <label for="rate1" title="1 star"><span aria-hidden="true">&#9733;</span><span class="sr-only">1 star</span></label>
                    </div>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <fieldset>
                <legend>Installation Details</legend>

                <div class="form-group">
                    <label for="installDate">Date of Installation</label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>
            </fieldset>

            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features <span class="hint">(Check all that apply)</span></legend>

                <div class="form-group checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="easySetup" name="features" value="Easy to setup">
                        <label for="easySetup">Easy to setup</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="quality" name="features" value="High quality build">
                        <label for="quality">High quality build</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="durability" name="features" value="Durable">
                        <label for="durability">Durable</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="energyEfficient" name="features" value="Energy efficient">
                        <label for="energyEfficient">Energy efficient</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="easyUse" name="features" value="Easy to use">
                        <label for="easyUse">Easy to use</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="valueForMoney" name="features" value="Great value for money">
                        <label for="valueForMoney">Great value for money</label>
                    </div>
                </div>
            </fieldset>

            <!-- Written Review -->
            <fieldset>
                <legend>Written Review</legend>

                <div class="form-group">
                    <label for="writtenReview">Your Review <span class="hint">(Optional)</span></label>
                    <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Tell us about your experience with this product..."></textarea>
                </div>
            </fieldset>

            <!-- User Name -->
            <fieldset>
                <legend>Your Information</legend>

                <div class="form-group">
                    <label for="userName">Your Name <span class="hint">(Optional)</span></label>
                    <input type="text" id="userName" name="userName" placeholder="Enter your name">
                </div>
            </fieldset>

            <!-- Submit Button -->
            <div class="form-actions">
                <input type="submit" id="submitReview" value="Submit Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Mike Chishala &mdash; All rights reserved &mdash; Lusaka, Zambia</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
