<head>

    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <header>
        <h1>Lazy Loading Images</h1>
    </header>
    <main>
        <p>The images will load only when they come into view as the user scrolls</p>

        <img src="images/ana-singh.jpg" alt="Child wrapped in cloth" loading="lazy" width="400" height="600">
        <img src="images/ban-yido.jpg" alt="Maasai jumping ceremony" loading="lazy" width="400" height="600">
        <img src="images/damian-patkowski.jpg" alt="African savanna sunset" loading="lazy" width="400" height="600">
        <img src="images/giusi-borrasi.jpg" alt="Maasai women in traditional jewelry" loading="lazy" width="400"
            height="600">
        <img src="images/hu-chen.jpg" alt="Silhouetted tree at sunset" loading="lazy" width="400" height="600">
        <img src="images/ian-macharia.jpg" alt="Another beautiful savanna view" loading="lazy" width="400" height="600">

    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span>. All rights reserved. Lazy Loading Assignment. Last Modified: <span
                id="lastModified"></span></p>
    </footer>
